name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # rates.yml calls this after committing new rates: pushes made with
  # GITHUB_TOKEN don't trigger `push` workflows on their own.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # vars.SITE_URL overrides once a custom domain is set up.
          VITE_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          SITE_BASE: ${{ vars.SITE_URL && '/' || format('{0}/', steps.pages.outputs.base_path) }}
          VITE_AFF_LENDO: ${{ vars.AFF_LENDO }}
          VITE_AFF_ZMARTA: ${{ vars.AFF_ZMARTA }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
